spring.datasource.url=jdbc:h2:mem:template_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=test-secret-key-for-jwt-token-generation-and-validation
app.jwt.expiration=3600

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@template.local
spring.mail.password=test

app.mail.from=test@template.local
app.mail.sender-name=Template Test
app.otp.expiration-minutes=10
app.otp.length=6

app.seed.enabled=false

spring.thymeleaf.prefix=classpath:/templates/email/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
