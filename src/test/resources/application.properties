spring.datasource.url=jdbc:h2:mem:wasac-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.seed.admin.email=test@example.com
app.seed.admin.password=Admin@123
app.seed.admin.full-name=System Administrator
app.seed.admin.phone=+250700000000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=test-secret-key-for-jwt-token-generation-and-validation
app.jwt.expiration=3600

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@template.local
spring.mail.password=test

app.mail.from=test@template.local
app.mail.sender-name=Template Test
app.otp.expiration-minutes=10
app.otp.length=6

app.seed.enabled=false
app.reminders.enabled=false

spring.thymeleaf.prefix=classpath:/templates/email/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
