spring.config.import=optional:file:.env[.properties]

server.port=4000
spring.application.name=WasacUtilityBilling

# ===== DATABASE =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
#Turn ddl-auto to validate after creating least info in the database
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

logging.level.org.flywaydb=DEBUG


# ===== SWAGGER =====
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# JWT
app.jwt.secret=${JWT_SECRET:wasac-jwt-secret-should-be-very-long-2026}
app.jwt.expiration=${JWT_EXPIRATION}

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ===== SMTP / MAIL =====
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== APP =====
app.mail.from=${MAIL_USERNAME}
app.mail.sender-name=WASAC Utility Billing
app.otp.expiration-minutes=10
app.otp.length=6

# Seed system admin on first startup (uses MAIL_USERNAME from .env)
app.seed.enabled=true
app.seed.admin.email=${MAIL_USERNAME}
app.seed.admin.password=Rodin!132
app.seed.admin.full-name=System Administrator
app.seed.admin.phone=+250794415318
app.reminders.enabled=true
app.reminders.lead-days=3
app.reminders.cron=0 0 8 * * *

# Thymeleaf (email templates only — no web views)
spring.thymeleaf.prefix=classpath:/templates/email/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=true