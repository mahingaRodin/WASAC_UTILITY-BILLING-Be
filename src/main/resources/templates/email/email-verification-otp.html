<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Verify your email</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:32px 0;">
    <tr>
        <td align="center">
            <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:32px;">
                <tr>
                    <td>
                        <h2 style="margin:0 0 16px;color:#1f2937;">Verify your email</h2>
                        <p style="margin:0 0 16px;color:#4b5563;line-height:1.5;">
                            Hi <span th:text="${userName}">User</span>,
                        </p>
                        <p style="margin:0 0 24px;color:#4b5563;line-height:1.5;">
                            Use the one-time code below to verify your email address for
                            <strong th:text="${appName}">Template</strong>.
                        </p>
                        <div style="background:#eef2ff;border-radius:8px;padding:20px;text-align:center;margin-bottom:24px;">
                            <span style="font-size:32px;letter-spacing:8px;font-weight:bold;color:#4338ca;"
                                  th:text="${otp}">123456</span>
                        </div>
                        <p style="margin:0 0 8px;color:#6b7280;font-size:14px;">
                            This code expires in <span th:text="${expiryMinutes}">10</span> minutes.
                        </p>
                        <p style="margin:0;color:#9ca3af;font-size:13px;">
                            If you did not request this, you can safely ignore this email.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
