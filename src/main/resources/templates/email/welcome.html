<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Welcome</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:32px 0;">
    <tr>
        <td align="center">
            <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:32px;">
                <tr>
                    <td>
                        <h2 style="margin:0 0 16px;color:#1f2937;">Welcome to <span th:text="${appName}">Template</span></h2>
                        <p style="margin:0 0 16px;color:#4b5563;line-height:1.5;">
                            Hi <span th:text="${userName}">User</span>,
                        </p>
                        <p style="margin:0 0 16px;color:#4b5563;line-height:1.5;">
                            Your email has been verified and your account is ready to use.
                        </p>
                        <p style="margin:0;color:#6b7280;font-size:14px;">
                            Thank you for joining us.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
