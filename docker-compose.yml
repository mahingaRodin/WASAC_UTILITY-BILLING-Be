services:
  postgres:
    image: postgres:17
    container_name: template_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: template_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: pass123
    ports:
      - "5433:5432"
    volumes:
      - template_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d template_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - template_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: template_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/template_db
    networks:
      - template_network

volumes:
  template_postgres_data:

networks:
  template_network:
    driver: bridge
