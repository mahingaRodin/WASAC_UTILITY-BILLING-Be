services:
  postgres:
    image: postgres:17
    container_name: wasac_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wasac_billing_db
      POSTGRES_USER: wasac_user
      POSTGRES_PASSWORD: wasac_pass_2026
    ports:
      - "5433:5432"
    volumes:
      - wasac_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasac_user -d wasac_billing_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wasac_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wasac_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/wasac_billing_db
    networks:
      - wasac_network

volumes:
  wasac_postgres_data:

networks:
  wasac_network:
    driver: bridge
