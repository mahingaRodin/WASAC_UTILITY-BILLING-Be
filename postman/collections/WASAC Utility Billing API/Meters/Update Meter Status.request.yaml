$kind: http-request
name: Update Meter Status
method: PATCH
url: '{{baseUrl}}/api/meters/{{meterId}}/status'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "INACTIVE"
    }
