$kind: http-request
name: Reset Password
method: POST
url: '{{baseUrl}}/api/auth/forgot-password/reset'
order: 7000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "john@example.com",
      "otp": "123456",
      "newPassword": "newSecurePass123"
    }
