$kind: http-request
name: Update User Status
method: PATCH
url: '{{baseUrl}}/api/users/{{userId}}/status'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "ACTIVE"
    }
