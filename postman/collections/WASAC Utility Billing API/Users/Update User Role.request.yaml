$kind: http-request
name: Update User Role
method: PATCH
url: '{{baseUrl}}/api/users/{{userId}}/role'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "role": "ROLE_OPERATOR"
    }
